services:
  querydog:
    image: ghcr.io/benjaminwootton/querydog:latest
    # To build locally instead, comment out 'image' and uncomment 'build':
    # build: .
    ports:
      - "3001:3001"
    volumes:
      - ./queries:/app/queries
      - ./querydog.yml:/app/querydog.yml
    restart: unless-stopped
