services:
  querydog:
    build: .
    image: querydog:local
    command: ["server"]
    ports:
      - "3001:3001"
    volumes:
      - ./queries:/app/queries
      # Mount querydog.yml from current directory or home directory
      - ${QUERYDOG_CONFIG:-./querydog.yml}:/app/querydog.yml
    restart: unless-stopped
